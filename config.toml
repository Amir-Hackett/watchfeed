[settings]
calendar_name  = "Watchfeed"
horizon_days   = 400      # how far ahead to pull
alarm_minutes  = 60       # popup this many minutes before. 0 = no alarm
all_day        = false    # true = ignore exact air times, use all-day events
public_url     = "https://amir-hackett.github.io/watchfeed/"       # where you host it; used in the RSS <link>

# ---------------------------------------------------------------------
# TV — matched against TVmaze. Use the show's real title, not the season.
# ---------------------------------------------------------------------
[tv]
shows = [
  "Lioness",
  "Furious",
  "The Pitt",
  "Neuromancer",
  "Reacher",
  "Neagley",
  "Slow Horses",
